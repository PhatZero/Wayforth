name: Build WayForth Forever

on:
  workflow_call:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: Upload the tested Forever beta to CurseForge
        type: boolean
        default: false
      changelog:
        description: Player-facing release notes for this upload
        type: string
        required: false

permissions:
  contents: read

jobs:
  addon-validate:
    name: Test and package WayForth
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate Lua 5.1 syntax
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.1
          find shared clients/forever -name '*.lua' -print0 | xargs -0 -n1 luac5.1 -p
      - name: Verify Forever full character names and surname compatibility
        run: lua5.1 tests/lua/test_forever_names.lua
      - name: Verify primary buttons render single captions
        run: lua5.1 tests/lua/test_button_labels.lua
      - name: Exercise quest sync in Lua 5.1
        run: lua5.1 tests/lua/test_quest_sync.lua
      - name: Exercise Guide Details previews and switching in Lua 5.1
        run: lua5.1 tests/lua/test_guide_details.lua
      - name: Exercise Smart Routes and quest ID auditing in Lua 5.1
        run: lua5.1 tests/lua/test_smart_routes.lua
      - name: Verify full 1-60 faction leveling tester library
        run: lua5.1 tests/lua/test_main_leveling.lua
      - name: Test Kalimdor Alliance source quests and route switching
        run: lua5.1 tests/lua/test_kalimdor_routes.lua
      - name: Verify faction quest IDs and map coordinates
        run: lua5.1 tests/lua/test_guide_maps.lua
      - name: Exercise waypoint and arrow fallbacks in Lua 5.1
        run: lua5.1 tests/lua/test_navigation.lua
      - name: Validate all Skyborne class/faction quest coordinate coverage
        run: lua5.1 tests/lua/test_zephras_location_catalog.lua
      - name: Run manifest and offline tests
        run: python3 -m unittest discover -s tests -v
      - name: Build installable addon ZIP
        run: python3 scripts/build.py
      - name: Upload preview ZIP
        uses: actions/upload-artifact@v4
        with:
          name: WayForth-1.0.0-beta-Forever-preview
          path: dist/WayForth-1.0.0-beta-Forever-16001.zip
          if-no-files-found: error
      - name: Submit Forever beta to CurseForge
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        env:
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          CURSEFORGE_PROJECT_ID: ${{ vars.CURSEFORGE_PROJECT_ID }}
          CHANGELOG: ${{ inputs.changelog }}
        run: bash scripts/upload-forever.sh dist/*.zip
