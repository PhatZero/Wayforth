name: Build WayForth Forever

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: Upload the tested Forever beta to CurseForge
        type: boolean
        default: false
      changelog:
        description: Player-facing release notes for this upload
        type: string
        required: false

permissions:
  contents: read

jobs:
  build:
    if: github.event_name != 'workflow_dispatch' || !inputs.publish
    uses: ./.github/workflows/validate-forever.yml
  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      changelog: ${{ inputs.changelog }}
      curseforge: true
    secrets: inherit
