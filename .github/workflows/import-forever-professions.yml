name: Import WoW Forever profession source data

on:
  push:
    branches: [fix/forever-profession-ac-validation]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: foreverdb-profession-import
  cancel-in-progress: true

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download all ForeverDB profession and gathering data
        env:
          FOREVERDB_API_KEY: ${{ secrets.FOREVERDB_API_KEY }}
        run: |
          if [ -z "$FOREVERDB_API_KEY" ]; then
            echo "::error::Set FOREVERDB_API_KEY in repository Actions secrets"
            exit 1
          fi
          python3 scripts/fetch_foreverdb_professions.py build/foreverdb
      - name: Build verified offline profession catalogs and coverage report
        run: |
          python3 scripts/build_foreverdb_profession_lua.py build/foreverdb clients/forever/guides/ForeverProfessionData.lua data/forever/profession_coverage.json
      - name: Commit compiled data to the development branch
        if: github.event_name == 'push' && github.ref_name == 'fix/forever-profession-ac-validation'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add clients/forever/guides/ForeverProfessionData.lua data/forever/profession_coverage.json
          if ! git diff --cached --quiet; then
            git commit -m "data: import verified Forever 1.60.1 profession recipe catalog"
            git push origin HEAD:refs/heads/fix/forever-profession-ac-validation
          fi
      - name: Upload source snapshot for review
        uses: actions/upload-artifact@v4
        with:
          name: foreverdb-professions-source
          path: build/foreverdb/
          retention-days: 7
