name: Import WoW Forever profession source data

on:
  push:
    branches: [fix/forever-profession-ac-validation]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download all ForeverDB profession and gathering data
        env:
          FOREVERDB_API_KEY: ${{ secrets.FOREVERDB_API_KEY }}
        run: |
          if [ -z "$FOREVERDB_API_KEY" ]; then
            echo "::error::Set FOREVERDB_API_KEY in repository Actions secrets"
            exit 1
          fi
          python3 scripts/fetch_foreverdb_professions.py build/foreverdb
      - name: Inspect published Forever recipe schema
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          for slug in ("alchemy", "leatherworking", "fishing"):
              data=json.loads((Path("build/foreverdb")/(slug+".json")).read_text())
              page=data["pages"][0]
              rows=page.get("data",[])
              if isinstance(rows,dict): rows=rows.get("recipes",rows.get("results",[]))
              print("PROFESSION SCHEMA",slug,json.dumps(rows[0] if rows else {},ensure_ascii=True)[:10000],flush=True)
          print("META SCHEMA",json.dumps(json.loads(Path("build/foreverdb/meta.json").read_text()),ensure_ascii=True)[:4000],flush=True)
          PY
      - name: Upload source snapshot for review
        uses: actions/upload-artifact@v4
        with:
          name: foreverdb-professions-source
          path: build/foreverdb/
          retention-days: 7
