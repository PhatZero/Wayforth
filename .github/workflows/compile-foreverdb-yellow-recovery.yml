name: Rebuild ForeverDB yellow-only catalog
on:
  push:
    branches: [feat/foreverdb-yellow-source-recovery]
    paths:
      - '.github/workflows/compile-foreverdb-yellow-recovery.yml'
      - 'scripts/build_foreverdb_profession_lua.py'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/foreverdb-yellow-source-recovery
      - name: Fetch build-matched original ForeverDB snapshot
        uses: actions/download-artifact@v4
        with:
          name: foreverdb-professions-source
          run-id: 43670381695
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: build/foreverdb
      - name: Convert eligible client yellow bands to WayForth
        run: |
          python3 scripts/build_foreverdb_profession_lua.py build/foreverdb clients/forever/guides/ForeverProfessionData.lua data/forever/profession_coverage.json
      - name: Commit source-provenance-separated catalog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add clients/forever/guides/ForeverProfessionData.lua data/forever/profession_coverage.json
          if ! git diff --cached --quiet; then
            git commit -m "data: recover client yellow thresholds discarded by orange-only importer"
            git push origin HEAD:refs/heads/feat/foreverdb-yellow-source-recovery
          fi
