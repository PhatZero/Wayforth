name: Test and package Forever
on:
  workflow_call:
    inputs:
      version:
        type: string
        default: ''

permissions:
  contents: read

jobs:
  addon-validate:
    name: Test and package WayForth
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Checkout pinned corrected quest sources
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v4
        with:
          repository: Questie/QuestieDB
          ref: aca0da1c4a5ed0bc12997b9aaeef7b35af9ee26e
          path: .quest-source
          persist-credentials: false
      - name: Checkout pinned supplemental catalog
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v4
        with:
          repository: ATTWoWAddon/AllTheThings
          ref: d30715fb2657743d1b8801e5e3f26b96b7047160
          path: .att-source
          persist-credentials: false
      - name: Regenerate original objective database
        if: github.event_name == 'pull_request'
        run: |
          python3 scripts/import_forever_locations.py .quest-source --att .att-source --cache "$RUNNER_TEMP/wayforth-cache" --cached-only
          grep -q 'objectiveRequirements = {' clients/forever/guides/ForeverQuestLocations.lua
      - name: Upload regenerated quest catalog
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: WayForth-Regenerated-Quest-Data
          path: clients/forever/guides/ForeverQuestLocations.lua
          if-no-files-found: error
      - name: Stamp release version
        if: inputs.version != ''
        env:
          VERSION: ${{ inputs.version }}
        run: python3 scripts/forever_version.py stamp "$VERSION"
      - name: Validate Lua 5.1 syntax
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.1
          find shared clients/forever -name '*.lua' -print0 | xargs -0 -n1 luac5.1 -p
      - name: Audit walkthrough coverage
        run: lua5.1 scripts/audit_walkthrough_instructions.lua > walkthrough-audit.txt
      - name: Upload walkthrough audit
        uses: actions/upload-artifact@v4
        with:
          name: WayForth-Walkthrough-Audit
          path: walkthrough-audit.txt
          if-no-files-found: error
      - name: Verify Forever full character names and surname compatibility
        run: lua5.1 tests/lua/test_forever_names.lua
      - name: Verify primary buttons render single captions
        run: lua5.1 tests/lua/test_button_labels.lua
      - name: Verify minimap placement and EllesmereUI ownership
        run: lua5.1 tests/lua/test_minimap_compat.lua
      - name: Verify closable tracker tabs and guide progress preservation
        run: lua5.1 tests/lua/test_tracker_tabs.lua
      - name: Verify navigation three-dot close button preserves tracker state
        run: lua5.1 tests/lua/test_tracker_menu.lua
      - name: Exercise quest sync in Lua 5.1
        run: lua5.1 tests/lua/test_quest_sync.lua
      - name: Verify simple step reader never silently reroutes
        run: lua5.1 tests/lua/test_simple_step_reader.lua
      - name: Verify safe guide progress rebuild and restore
        run: lua5.1 tests/lua/test_rebuild_progress.lua
      - name: Verify tracker displays the step reader instead of legacy hub sweep
        run: lua5.1 tests/lua/test_step_reader_tracker.lua
      - name: Simulate a real Forever quest hub, manual checkpoint and reload
        run: lua5.1 tests/lua/test_step_reader_real_guide.lua
      - name: Verify login, quest and zone events do not recalculate routes
        run: lua5.1 tests/lua/test_step_reader_event_flow.lua
      - name: Verify live quest objective counters and tracker refresh
        run: lua5.1 tests/lua/test_live_objectives.lua
      - name: Verify hub pickup rounds and grouped quest turn-ins
        run: lua5.1 tests/lua/test_hub_routes.lua
      - name: Exercise Guide Details previews and switching in Lua 5.1
        run: lua5.1 tests/lua/test_guide_details.lua
      - name: Exercise Smart Routes and quest ID auditing in Lua 5.1
        run: lua5.1 tests/lua/test_smart_routes.lua
      - name: Verify premium hub sweep and navigation alignment
        run: lua5.1 tests/lua/test_hub_sweep.lua
      - name: Verify secure quest-item discovery fallbacks
        run: lua5.1 tests/lua/test_quest_items.lua
      - name: Prevent Zephras mid-guide quest mismatch and wrong waypoints
        run: lua5.1 tests/lua/test_zephras_midguide.lua
      - name: Verify prerequisite-aware recovery across every leveling guide
        run: lua5.1 tests/lua/test_all_guide_recovery.lua
      - name: Verify Westfall authored quest circuits and stable step IDs
        run: lua5.1 tests/lua/test_westfall_route.lua
      - name: Verify all leveling-zone pickup circuits and saved-step migration
        run: lua5.1 tests/lua/test_all_zone_circuits.lua
      - name: Verify phase-specific quest destinations and saved progress
        run: lua5.1 tests/lua/test_quest_locations.lua
      - name: Verify full 1-60 faction leveling tester library
        run: lua5.1 tests/lua/test_main_leveling.lua
      - name: Test Kalimdor Alliance source quests and route switching
        run: lua5.1 tests/lua/test_kalimdor_routes.lua
      - name: Verify faction quest IDs and map coordinates
        run: lua5.1 tests/lua/test_guide_maps.lua
      - name: Exercise waypoint and arrow fallbacks in Lua 5.1
        run: lua5.1 tests/lua/test_navigation.lua
      - name: Verify real world-map pins and cross-zone arrow bearings
        run: lua5.1 tests/lua/test_map_pin.lua
      - name: Validate all Skyborne class/faction quest coordinate coverage
        run: lua5.1 tests/lua/test_zephras_location_catalog.lua
      - name: Verify bug reports, blockers and navigation feedback
        run: lua5.1 tests/lua/test_enhancements.lua
      - name: Verify secure item combat lifecycle
        run: lua5.1 tests/lua/test_quest_item_button.lua
      - name: Verify quest recovery, travel, zone suggestions and quest interactions
        run: lua5.1 tests/lua/test_quest_assistance.lua
      - name: Suppress next-zone prompts during flights and post-landing grace
        run: lua5.1 tests/lua/test_next_zone_flight.lua
      - name: Verify quest-log capacity and read-only guide search
        run: lua5.1 tests/lua/test_log_space_search.lua
      - name: Audit all guides, prerequisites, travel and event bursts
        run: lua5.1 tests/lua/test_all_guide_polish.lua
      - name: Verify orange-only offline profession route planner
        run: lua5.1 tests/lua/test_profession_routes.lua
      - name: Validate real Forever 1-300 recipe catalog across 12 professions
        run: lua5.1 tests/lua/test_forever_profession_catalog.lua
      - name: Verify profession runtime materials, skill bands, and observed craft events
        run: lua5.1 tests/lua/test_profession_runtime.lua
      - name: Verify source-backed dungeon quest manifest and live checklist
        run: lua5.1 tests/lua/test_dungeon_guides.lua
      - name: Guard unsupported Forever profession events during bootstrap
        run: lua5.1 tests/lua/test_bootstrap_event_compat.lua
      - name: Run new progression and travel regression tests
        run: |
          lua5.1 tests/lua/test_alliance_progression.lua
          lua5.1 tests/lua/test_horde_progression.lua
          lua5.1 tests/lua/test_chapter_travel.lua
          lua5.1 tests/lua/test_xp_progression.lua
      - name: Run manifest and offline tests
        run: python3 -m unittest discover -s tests -v
      - name: Build installable addon ZIP
        run: python3 scripts/build.py
      - name: Upload preview ZIP
        uses: actions/upload-artifact@v4
        with:
          name: WayForth-Forever
          path: dist/*.zip
          if-no-files-found: error
