name: Commit original walkthrough data
on:
  push:
    branches: ['rebuild/1.1']
    paths: ['.github/workflows/commit-walkthrough-data.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  regenerate:
    if: github.ref == 'refs/heads/rebuild/1.1'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rebuild/1.1
      - uses: actions/checkout@v4
        with:
          repository: Questie/QuestieDB
          ref: aca0da1c4a5ed0bc12997b9aaeef7b35af9ee26e
          path: .quest-source
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: ATTWoWAddon/AllTheThings
          ref: d30715fb2657743d1b8801e5e3f26b96b7047160
          path: .att-source
          persist-credentials: false
      - name: Regenerate catalog from pinned sources
        run: |
          python3 scripts/import_forever_locations.py .quest-source --att .att-source --cache "$RUNNER_TEMP/wayforth-cache" --cached-only
          grep -q 'objectiveRequirements = {' clients/forever/guides/ForeverQuestLocations.lua
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.1
          luac5.1 -p clients/forever/guides/ForeverQuestLocations.lua
      - name: Audit generated walkthroughs
        run: |
          lua5.1 scripts/audit_walkthrough_instructions.lua > walkthrough-audit.txt
          cat walkthrough-audit.txt
      - name: Commit only generated catalog to rebuild branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add clients/forever/guides/ForeverQuestLocations.lua
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Regenerate original Forever quest walkthrough catalog"
          git push origin HEAD:refs/heads/rebuild/1.1
      - uses: actions/upload-artifact@v4
        with:
          name: Walkthrough-Coverage
          path: walkthrough-audit.txt
