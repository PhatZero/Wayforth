name: Release WayForth Forever

on:
  push:
    tags: ['forever-v*-beta*']
  workflow_call:
    inputs:
      changelog:
        required: true
        type: string
      curseforge:
        type: boolean
  workflow_dispatch:
    inputs:
      changelog:
        description: Release notes shown to players
        required: true
        type: string
      curseforge:
        description: Also submit the beta to CurseForge
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: wayforth-forever-release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      number: ${{ steps.select.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: select
        run: echo "version=$(python3 scripts/forever_version.py select)" >> "$GITHUB_OUTPUT"
      - name: Verify selected version
        env:
          VERSION: ${{ steps.select.outputs.version }}
        run: test -n "$VERSION"

  build:
    needs: version
    uses: ./.github/workflows/validate-forever.yml
    with:
      version: ${{ needs.version.outputs.number }}

  release:
    needs: [build, version]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: WayForth-Forever
          path: dist
      - name: Publish the tested ZIP as a GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          CHANGELOG: ${{ inputs.changelog }}
        shell: bash
        run: |
          set -euo pipefail
          archives=(dist/*.zip)
          [[ ${#archives[@]} == 1 && -f ${archives[0]} ]]
          archive=${archives[0]}
          version=$(unzip -p "$archive" WayForth/WayForth.toc | tr -d '\r' | sed -n 's/^## Version: //p')
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+-beta[.0-9]*$ ]]
          tag="forever-v$version"
          if git ls-remote --exit-code origin "refs/tags/$tag" >/dev/null; then
            git fetch origin "refs/tags/$tag:refs/tags/$tag"
            [[ $(git rev-list -n 1 "$tag") == "$GITHUB_SHA" ]] || { echo "Tag targets another commit."; exit 1; }
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            existing=$(mktemp -d)
            if ! gh release view "$tag" --json assets --jq '.assets[].name' | grep -Fxq "$(basename "$archive")"; then
              gh release upload "$tag" "$archive"
            fi
            gh release download "$tag" --pattern "$(basename "$archive")" --dir "$existing"
            # ZIP member timestamps may differ between builds of the same commit.
            unzip -q "$archive" -d "$existing/current"
            unzip -q "$existing/$(basename "$archive")" -d "$existing/released"
            diff -qr "$existing/current" "$existing/released"
          else
            notes=(--generate-notes)
            if [[ -n "$CHANGELOG" ]]; then
              printf '%s\n' "$CHANGELOG" > "$RUNNER_TEMP/notes.md"
              notes=(--notes-file "$RUNNER_TEMP/notes.md")
            fi
            gh release create "$tag" "$archive" --target "$GITHUB_SHA" --prerelease \
              --title "WayForth $version (Forever)" "${notes[@]}"
          fi
      - name: Submit to CurseForge
        if: inputs.curseforge || (github.event_name == 'push' && vars.CURSEFORGE_PUBLISH_TAGS == 'true')
        env:
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          CURSEFORGE_PROJECT_ID: ${{ vars.CURSEFORGE_PROJECT_ID }}
          CHANGELOG: ${{ inputs.changelog }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: forever-v${{ needs.version.outputs.number }}
        run: |
          if [[ -z "$CHANGELOG" ]]; then
            CHANGELOG=$(gh release view "$RELEASE_TAG" --json body --jq .body)
            export CHANGELOG="${CHANGELOG:-WayForth Forever $RELEASE_TAG}"
          fi
          bash scripts/upload-forever.sh dist/*.zip
